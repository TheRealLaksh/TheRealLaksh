name: Refresh stats

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_stats.py", "scripts/svgkit.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/light/stats.svg assets/light/heatmap.svg assets/light/langs.svg assets/dark/stats.svg assets/dark/heatmap.svg assets/dark/langs.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats cards" && git push)
