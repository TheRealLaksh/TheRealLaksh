name: Refresh stats

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/mono.py", "scripts/typo.py", "scripts/project-notes.json", "scripts/project-list.json", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Draw stats and graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/mono.py stats
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/mono/stats.svg assets/mono/activity.svg assets/mono/card-*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats" && git push)
