<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><style>
.fb{transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.45);opacity:0}}
@keyframes dart{0%{transform:translate(34px,-34px);opacity:0}14%{transform:translate(0,0);opacity:1}86%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes typeline{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.28}45%{transform:scale(.6);opacity:.12}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
@keyframes drawline{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(260%)}}
@keyframes spinslow{to{transform:rotate(360deg)}}
@keyframes wave{to{transform:translateX(-600px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B1B3A" flood-opacity=".22"/></filter></defs><path d="M-600 150 q150 -34 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V260 H-600Z" fill="#2F5BFF" opacity="0.22" style="animation:wave 14s linear 0s infinite"/><path d="M-600 172 q150 -28 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V260 H-600Z" fill="#8B7CFF" opacity="0.25" style="animation:wave 19s linear -4s infinite"/><path d="M-600 196 q150 -22 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V260 H-600Z" fill="#14B38A" opacity="0.28" style="animation:wave 24s linear -9s infinite"/><text x="600" y="92" text-anchor="middle" font-size="46" font-weight="800" fill="#0B1B3A" letter-spacing="-1">Let's build something good.</text><text x="600" y="128" text-anchor="middle" font-size="19" fill="#5B6B8C">Collaborations, ideas and hello messages are all welcome.</text><g transform="translate(160 90) rotate(0) scale(0.7)"><g class="fb float" style="animation:float 4.2s ease-in-out 0.3s infinite;"><g transform="rotate(40)" filter="url(#sh)"><path d="M-7 32 Q0 70 7 32Z" fill="#FF7A3D" stroke="#fff" stroke-width="6" stroke-linejoin="round" style="transform-box:fill-box;transform-origin:50% 0;animation:flame .45s ease-in-out infinite"/><path d="M-15 12 L-34 40 L-15 32Z M15 12 L34 40 L15 32Z" fill="#FF6FA8" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><path d="M0 -54 C24 -32 24 6 15 32 L-15 32 C-24 6 -24 -32 0 -54Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><path d="M0 -54 C24 -32 24 6 15 32 L-15 32 C-24 6 -24 -32 0 -54Z" fill="#F1F4FF"/><path d="M0 -54 C13 -43 18 -33 20 -24 L-20 -24 C-18 -33 -13 -43 0 -54Z" fill="#FF7A3D"/><circle cy="-8" r="10" fill="#2F5BFF" stroke="#fff" stroke-width="4"/><rect x="-15" y="24" width="30" height="8" fill="#0B1B3A" opacity=".12"/></g></g></g><g transform="translate(1040 92) rotate(8) scale(0.62)"><g class="fb float" style="animation:float 5s ease-in-out 0.7s infinite;"><g filter="url(#sh)"><circle r="56" fill="#fff"/><circle r="47" fill="#2F5BFF"/><circle r="35" fill="#fff"/><circle r="24" fill="#FF7A3D"/><circle r="12" fill="#fff"/><circle r="5" fill="#0B1B3A"/></g><circle r="47" fill="none" stroke="#2F5BFF" stroke-width="3" class="fb ring" style="animation:ring 2.4s ease-in-out 0.7s infinite;"/><g class="fb" style="animation:dart 4.4s ease-out 0.7s infinite"><line x1="62" y1="-62" x2="6" y2="-6" stroke="#0B1B3A" stroke-width="5" stroke-linecap="round"/><path d="M62 -62 L46 -64 L50 -50Z M54 -54 L38 -56 L42 -42Z" fill="#FF6FA8" stroke="#fff" stroke-width="2"/></g></g></g><g transform="translate(300 60)"><path d="M0 -11 Q0 0 11 0 Q0 0 0 11 Q0 0 -11 0 Q0 0 0 -11Z" fill="#FFC93C" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" class="fb twinkle" style="animation:twinkle 2.6s ease-in-out 0s infinite;"/></g><g transform="translate(900 50)"><path d="M0 -13 Q0 0 13 0 Q0 0 0 13 Q0 0 -13 0 Q0 0 0 -13Z" fill="#FF6FA8" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" class="fb twinkle" style="animation:twinkle 2.6s ease-in-out 0.6s infinite;"/></g><g transform="translate(250 130)"><path d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z" fill="#2F5BFF" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" class="fb twinkle" style="animation:twinkle 2.6s ease-in-out 1.1s infinite;"/></g><g transform="translate(960 138)"><path d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z" fill="#14B38A" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" class="fb twinkle" style="animation:twinkle 2.6s ease-in-out 1.6s infinite;"/></g></svg>