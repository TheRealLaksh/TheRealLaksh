<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><style>
.fb{transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.45);opacity:0}}
@keyframes dart{0%{transform:translate(34px,-34px);opacity:0}14%{transform:translate(0,0);opacity:1}86%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes typeline{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.28}45%{transform:scale(.6);opacity:.12}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
@keyframes drawline{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(260%)}}
@keyframes spinslow{to{transform:rotate(360deg)}}
@keyframes wave{to{transform:translateX(-600px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B1B3A" flood-opacity=".22"/></filter></defs><g transform="translate(20 0)"><g transform="translate(0 0)" style="animation:rise .7s ease-out 0.0s both"><rect x="1" y="1" width="382" height="138" rx="24" fill="#F6F8FF" stroke="#DCE3F5" stroke-width="1.5"/><rect x="1" y="1" width="12" height="138" rx="6" fill="#14B38A" opacity=".9"/><g transform="translate(36 38)"><circle r="11" fill="#14B38A" opacity=".25" class="fb ring" style="animation:ring 2s ease-in-out 0.0s infinite;"/><circle r="5.5" fill="#14B38A"/></g><text x="56" y="44" font-size="14" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" fill="#5B6B8C" letter-spacing="2">NOW</text><text x="34" y="86" font-size="26" font-weight="800" fill="#0B1B3A">Tech head</text><text x="34" y="116" font-size="16" fill="#5B6B8C">ShiftsDeal, a venue booking marketplace</text></g><g transform="translate(408 0)" style="animation:rise .7s ease-out 0.15s both"><rect x="1" y="1" width="382" height="138" rx="24" fill="#F6F8FF" stroke="#DCE3F5" stroke-width="1.5"/><rect x="1" y="1" width="12" height="138" rx="6" fill="#2F5BFF" opacity=".9"/><g transform="translate(36 38)"><circle r="11" fill="#2F5BFF" opacity=".25" class="fb ring" style="animation:ring 2s ease-in-out 0.3s infinite;"/><circle r="5.5" fill="#2F5BFF"/></g><text x="56" y="44" font-size="14" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" fill="#5B6B8C" letter-spacing="2">NOW</text><text x="34" y="86" font-size="26" font-weight="800" fill="#0B1B3A">UG Data Science &amp; AI</text><text x="34" y="116" font-size="16" fill="#5B6B8C">Masters' Union, class of 2030</text></g><g transform="translate(816 0)" style="animation:rise .7s ease-out 0.3s both"><rect x="1" y="1" width="382" height="138" rx="24" fill="#F6F8FF" stroke="#DCE3F5" stroke-width="1.5"/><rect x="1" y="1" width="12" height="138" rx="6" fill="#FF7A3D" opacity=".9"/><g transform="translate(36 38)"><circle r="11" fill="#FF7A3D" opacity=".25" class="fb ring" style="animation:ring 2s ease-in-out 0.6s infinite;"/><circle r="5.5" fill="#FF7A3D"/></g><text x="56" y="44" font-size="14" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" fill="#5B6B8C" letter-spacing="2">NOW</text><text x="34" y="86" font-size="26" font-weight="800" fill="#0B1B3A">Freelance web builds</text><text x="34" y="116" font-size="16" fill="#5B6B8C">Client sites with their own CMS panels</text></g></g></svg>