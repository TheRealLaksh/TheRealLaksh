<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 196" width="580" height="196" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><style>
.fb{transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.45);opacity:0}}
@keyframes dart{0%{transform:translate(34px,-34px);opacity:0}14%{transform:translate(0,0);opacity:1}86%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes typeline{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.28}45%{transform:scale(.6);opacity:.12}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
@keyframes drawline{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(260%)}}
@keyframes spinslow{to{transform:rotate(360deg)}}
@keyframes wave{to{transform:translateX(-600px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B1B3A" flood-opacity=".22"/></filter><clipPath id="cc"><rect x="1" y="1" width="578" height="194" rx="26"/></clipPath></defs><g clip-path="url(#cc)"><rect width="580" height="196" fill="#121A2E"/><circle cx="520" cy="30" r="86" fill="#6C8CFF" opacity=".16" class="fb drift" style="animation:drift 9s ease-in-out 4s infinite;"/><circle cx="560" cy="170" r="46" fill="#6C8CFF" opacity=".12" class="fb drift" style="animation:drift 11s ease-in-out 1s infinite;"/><g style="animation:sweep 6s ease-in-out 2s infinite"><rect x="-80" y="-20" width="60" height="240" fill="#FFFFFF" opacity=".07" transform="skewX(-18)"/></g></g><rect x="1" y="1" width="578" height="194" rx="26" fill="none" stroke="#25304D" stroke-width="1.5"/><rect x="28" y="26" width="141.36" height="26" rx="13" fill="#6C8CFF"/><text x="98.68" y="44" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" letter-spacing="1.2">RESUME BUILDER</text><text x="28" y="88" font-size="28" font-weight="800" fill="#E8EEFF" letter-spacing="-.5">Profiley</text><text x="28" y="112" font-size="15.5" fill="#8FA0C4">A reactive resume builder with real-time</text><text x="28" y="133" font-size="15.5" fill="#8FA0C4">WYSIWYG editing and 10+ templates.</text><g transform="translate(28 150)"><rect width="78.08" height="28" rx="14" fill="#1B2850"/><text x="39.04" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#6C8CFF">React 19</text></g><g transform="translate(114.08 150)"><rect width="48.96" height="28" rx="14" fill="#1B2850"/><text x="24.48" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#6C8CFF">Vite</text></g><g transform="translate(171.04 150)"><rect width="79.12" height="28" rx="14" fill="#1B2850"/><text x="39.56" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#6C8CFF">Tailwind</text></g><g transform="translate(530 34)"><circle r="20" fill="#0D1117" stroke="#25304D" stroke-width="1.5"/><path d="M-7 7 L7 -7 M-4 -7 H7 V4" fill="none" stroke="#6C8CFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>