 1.2s ease-out both"/><text x="68" y="272" font-size="34" font-weight="700" fill="#6C8CFF" opacity="0">Full-stack developer<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.2;.25;1" dur="14s" begin="0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;.04;.2;.25;1" dur="14s" begin="0.0s" repeatCount="indefinite"/></text><text x="68" y="272" font-size="34" font-weight="700" fill="#FF8F5C" opacity="0">Aspiring AI/ML engineer<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.2;.25;1" dur="14s" begin="3.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;.04;.2;.25;1" dur="14s" begin="3.5s" repeatCount="indefinite"/></text><text x="68" y="272" font-size="34" font-weight="700" fill="#3DD6AE" opacity="0">Tech head at ShiftsDeal<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.2;.25;1" dur="14s" begin="7.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;.04;.2;.25;1" dur="14s" begin="7.0s" repeatCount="indefinite"/></text><text x="68" y="272" font-size="34" font-weight="700" fill="#A99BFF" opacity="0">Data Science &amp; AI at Masters' Union<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.2;.25;1" dur="14s" begin="10.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;.04;.2;.25;1" dur="14s" begin="10.5s" repeatCount="indefinite"/></text><text x="68" y="326" font-size="19" fill="#8FA0C4">Varanasi, India. I build things for the web and teach machines to learn.</text><g transform="translate(905 118) rotate(6) scale(1.0)"><g class="fb float" style="animation:float 5s ease-in-out 0s infinite;"><g filter="url(#sh)"><circle r="56" fill="#fff"/><circle r="47" fill="#2F5