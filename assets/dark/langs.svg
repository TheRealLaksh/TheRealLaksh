<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><style>
.fb{transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.45);opacity:0}}
@keyframes dart{0%{transform:translate(34px,-34px);opacity:0}14%{transform:translate(0,0);opacity:1}86%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes typeline{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.28}45%{transform:scale(.6);opacity:.12}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
@keyframes drawline{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(260%)}}
@keyframes spinslow{to{transform:rotate(360deg)}}
@keyframes wave{to{transform:translateX(-600px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B1B3A" flood-opacity=".22"/></filter></defs><rect x="1" y="1" width="1198" height="226" rx="26" fill="#121A2E" stroke="#25304D" stroke-width="1.5"/><text x="40" y="44" font-size="22" font-weight="800" fill="#E8EEFF">Languages across my public repos</text><rect x="40.0" y="70" width="549.0" height="26" rx="13" fill="#6C8CFF" style="transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s ease-out 0.0s both"/><rect x="593.0" y="70" width="310.5" height="26" rx="13" fill="#FF8F5C" style="transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s ease-out 0.12s both"/><rect x="907.5" y="70" width="231.8" height="26" rx="13" fill="#3DD6AE" style="transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s ease-out 0.24s both"/><rect x="1143.3" y="70" width="9.3" height="26" rx="13" fill="#A99BFF" style="transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s ease-out 0.36s both"/><rect x="1156.6" y="70" width="2.0" height="26" rx="13" fill="#FF8DBB" style="transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s ease-out 0.48s both"/><rect x="1159.0" y="70" width="2.0" height="26" rx="13" fill="#FFD25E" style="transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s ease-out 0.6s both"/><circle cx="48" cy="135" r="8" fill="#6C8CFF"/><text x="68" y="140" font-size="18" font-weight="700" fill="#E8EEFF">JavaScript</text><text x="172.64" y="140" font-size="16" fill="#8FA0C4">49.3%</text><circle cx="428" cy="135" r="8" fill="#FF8F5C"/><text x="448" y="140" font-size="18" font-weight="700" fill="#E8EEFF">HTML</text><text x="510.0" y="140" font-size="16" fill="#8FA0C4">28.1%</text><circle cx="808" cy="135" r="8" fill="#3DD6AE"/><text x="828" y="140" font-size="18" font-weight="700" fill="#E8EEFF">CSS</text><text x="876.48" y="140" font-size="16" fill="#8FA0C4">21.0%</text><circle cx="48" cy="169" r="8" fill="#A99BFF"/><text x="68" y="174" font-size="18" font-weight="700" fill="#E8EEFF">Python</text><text x="141.44" y="174" font-size="16" fill="#8FA0C4">1.2%</text><circle cx="428" cy="169" r="8" fill="#FF8DBB"/><text x="448" y="174" font-size="18" font-weight="700" fill="#E8EEFF">TypeScript</text><text x="554.70375" y="174" font-size="16" fill="#8FA0C4">0.2%</text><circle cx="808" cy="169" r="8" fill="#FFD25E"/><text x="828" y="174" font-size="18" font-weight="700" fill="#E8EEFF">Shell</text><text x="882.72" y="174" font-size="16" fill="#8FA0C4">0.1%</text></svg>